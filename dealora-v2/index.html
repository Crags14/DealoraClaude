<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dealora — Canadian STR Deal Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
      --amber: #EF9F27; --red: #E24B4A;
      --bg: #F7F6F2; --surface: #FFFFFF; --border: rgba(0,0,0,0.1);
      --text: #1A1A1A; --muted: #6B6B6B;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav {
      background: var(--surface); border-bottom: 0.5px solid var(--border);
      padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
      height: 56px; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--text); text-decoration: none; }
    .logo span { color: var(--green); }
    .nav-tag { font-size: 11px; background: var(--green-light); color: var(--green-dark); padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .hero { text-align: center; padding: 3.5rem 1.5rem 2.5rem; max-width: 640px; margin: 0 auto; }
    .hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(28px, 5vw, 42px); font-weight: 400; line-height: 1.15; margin-bottom: 1rem; letter-spacing: -0.5px; }
    .hero h1 em { font-style: italic; color: var(--green); }
    .hero p { font-size: 15px; color: var(--muted); line-height: 1.6; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 1.5rem 4rem; }
    .search-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    .search-grid { display: grid; grid-template-columns: 1fr 100px 170px 120px auto; gap: 10px; align-items: flex-end; }
    @media (max-width: 700px) { .search-grid { grid-template-columns: 1fr 1fr; } .search-grid .analyze-btn { grid-column: 1 / -1; } }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .field input, .field select { height: 42px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: #FAFAF8; color: var(--text); outline: none; transition: border-color 0.15s; width: 100%; }
    .field input:focus, .field select:focus { border-color: var(--green); background: #fff; }
    .analyze-btn { height: 42px; padding: 0 24px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; transition: background 0.15s, transform 0.1s; }
    .analyze-btn:hover { background: var(--green-dark); }
    .analyze-btn:active { transform: scale(0.98); }
    .analyze-btn:disabled { background: #ccc; cursor: not-allowed; }
    .loading { text-align: center; padding: 4rem 2rem; display: none; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid #e0e0e0; border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 14px; color: var(--muted); }
    .results { display: none; }
    .error-msg { background: #FCEBEB; color: #501313; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; margin-bottom: 1rem; display: none; line-height: 1.5; }
    .score-banner { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: center; }
    .score-ring { width: 88px; height: 88px; border-radius: 50%; border: 3px solid var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
    .score-num { font-family: 'DM Serif Display', serif; font-size: 30px; line-height: 1; color: var(--green); }
    .score-sub { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 2px; }
    .score-info h2 { font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400; margin-bottom: 4px; }
    .score-info p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; margin-bottom: 8px; }
    .badge-green { background: #E1F5EE; color: #085041; }
    .badge-amber { background: #FAEEDA; color: #633806; }
    .badge-red { background: #FCEBEB; color: #501313; }
    .meta-row { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
    @media (max-width: 500px) { .metrics-grid { grid-template-columns: 1fr 1fr; } }
    .metric-tile { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; }
    .metric-tile .label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .metric-tile .value { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--text); line-height: 1; }
    .metric-tile .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .positive { color: var(--green) !important; }
    .negative { color: var(--red) !important; }
    .muted-text { color: var(--muted); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
    @media (max-width: 580px) { .two-col { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .panel-title { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); padding-bottom: 10px; border-bottom: 0.5px solid var(--border); margin-bottom: 12px; }
    .cf-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
    .cf-row:last-child { border-bottom: none; padding-top: 10px; margin-top: 4px; border-top: 1px solid var(--border); font-weight: 500; font-size: 14px; }
    .comp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.06); }
    .comp-row:last-child { border-bottom: none; }
    .comp-name { font-size: 13px; color: var(--text); }
    .comp-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .comp-adr { font-size: 14px; font-weight: 500; text-align: right; }
    .occ-bar { height: 3px; background: #eee; border-radius: 2px; margin-top: 5px; width: 72px; overflow: hidden; }
    .occ-fill { height: 100%; background: var(--green); border-radius: 2px; }
    .insights-panel { margin-bottom: 1rem; }
    .insight-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.06); font-size: 13px; color: var(--muted); line-height: 1.5; }
    .insight-item:last-child { border-bottom: none; }
    .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
    .dot-green { background: var(--green); }
    .dot-amber { background: var(--amber); }
    .dot-red { background: var(--red); }
    .disclaimer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 2rem; opacity: 0.7; line-height: 1.6; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">deal<span>ora</span></a>
  <span class="nav-tag">Canadian STR Analyzer</span>
</nav>
<div class="hero">
  <h1>Analyze any Canadian<br/><em>Airbnb deal</em> in seconds</h1>
  <p>Enter an address and purchase price. Dealora pulls comps, estimates cashflow, calculates your return, and scores the deal — instantly.</p>
</div>
<div class="container">
  <div class="search-card">
    <div class="search-grid">
      <div class="field">
        <label>Address or City</label>
        <input type="text" id="address" placeholder="e.g. 12 Oak St, Collingwood, ON" />
      </div>
      <div class="field">
        <label>Bedrooms</label>
        <select id="bedrooms">
          <option value="1">1 bed</option>
          <option value="2" selected>2 bed</option>
          <option value="3">3 bed</option>
          <option value="4">4 bed</option>
          <option value="5">5+ bed</option>
        </select>
      </div>
      <div class="field">
        <label>Purchase Price (CAD)</label>
        <input type="text" id="price" placeholder="650000" />
      </div>
      <div class="field">
        <label>Down Payment</label>
        <select id="downpayment">
          <option value="20" selected>20%</option>
          <option value="25">25%</option>
          <option value="30">30%</option>
          <option value="35">35%</option>
        </select>
      </div>
      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">Analyze →</button>
    </div>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Pulling comps and running your analysis...</p>
  </div>
  <div class="results" id="results"></div>
</div>
<script>
function fmt(n) { return '$' + Math.round(n).toLocaleString('en-CA'); }
function pct(n) { return (n * 100).toFixed(1) + '%'; }
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('analyzeBtn').disabled = false;
}

async function analyze() {
  const address = document.getElementById('address').value.trim();
  const bedrooms = document.getElementById('bedrooms').value;
  const priceRaw = document.getElementById('price').value.replace(/[$,\s]/g, '');
  const downPct = parseFloat(document.getElementById('downpayment').value) / 100;

  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('results').style.display = 'none';

  if (!address) return showError('Please enter an address or city.');
  const purchasePrice = parseFloat(priceRaw);
  if (!priceRaw || isNaN(purchasePrice) || purchasePrice < 50000) return showError('Please enter a valid purchase price (e.g. 650000).');

  document.getElementById('loading').style.display = 'block';
  document.getElementById('analyzeBtn').disabled = true;

  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, bedrooms, purchasePrice, downPct })
    });

    const d = await response.json();
    if (!response.ok) return showError(d.error || 'Analysis failed. Please try again.');
    renderResults(d, purchasePrice, downPct);
  } catch (err) {
    showError('Connection error. Please try again.');
    console.error(err);
  }
}

function renderResults(d, purchasePrice, downPct) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('analyzeBtn').disabled = false;

  const downAmount = purchasePrice * downPct;
  const scoreColor = d.dealScore >= 70 ? 'var(--green)' : d.dealScore >= 50 ? 'var(--amber)' : 'var(--red)';
  const badgeClass = ['Strong Buy','Solid Deal'].includes(d.verdict) ? 'badge-green' : d.verdict === 'Marginal' ? 'badge-amber' : 'badge-red';
  const cashClass = d.cashflow >= 0 ? 'positive' : 'negative';
  const riskColor = d.strRisk === 'Low' ? '#085041' : d.strRisk === 'Medium' ? '#633806' : '#501313';
  const riskBg = d.strRisk === 'Low' ? '#E1F5EE' : d.strRisk === 'Medium' ? '#FAEEDA' : '#FCEBEB';

  const expenseRows = [
    ['Mortgage', d.expenses.mortgage],
    ['Property tax', d.expenses.propertyTax],
    ['STR insurance', d.expenses.insurance],
    ['Platform fees (15%)', d.expenses.management],
    ['Utilities', d.expenses.utilities],
    ['Cleaning', d.expenses.cleaning],
    ['Maintenance reserve', d.expenses.maintenance],
  ];

  document.getElementById('results').innerHTML = `
    <div class="score-banner">
      <div class="score-ring" style="border-color:${scoreColor}">
        <div class="score-num" style="color:${scoreColor}">${d.dealScore}</div>
        <div class="score-sub">Dealora</div>
      </div>
      <div class="score-info">
        <span class="badge ${badgeClass}">${d.verdict}</span>
        <h2>${d.market}</h2>
        <p>${d.verdictReason}</p>
        <div class="meta-row">Peak season: ${d.bestMonths} &nbsp;&bull;&nbsp; STR risk: <span style="background:${riskBg};color:${riskColor};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500">${d.strRisk}</span></div>
      </div>
    </div>
    <div class="metrics-grid">
      <div class="metric-tile"><div class="label">Avg Daily Rate</div><div class="value">${fmt(d.adr)}</div><div class="sub">per night</div></div>
      <div class="metric-tile"><div class="label">Occupancy</div><div class="value">${pct(d.occupancy)}</div><div class="sub">${Math.round(d.occupancy * 365)} nights/yr</div></div>
      <div class="metric-tile"><div class="label">Gross Revenue</div><div class="value">${fmt(d.monthlyRevenue)}</div><div class="sub">${fmt(d.annualRevenue)}/yr</div></div>
      <div class="metric-tile"><div class="label">Monthly Cashflow</div><div class="value ${cashClass}">${d.cashflow >= 0 ? '+' : ''}${fmt(d.cashflow)}</div><div class="sub">${fmt(d.annualCashflow)}/yr</div></div>
      <div class="metric-tile"><div class="label">Cash-on-Cash Return</div><div class="value ${d.cocReturn >= 0.06 ? 'positive' : ''}">${pct(d.cocReturn)}</div><div class="sub">${fmt(downAmount)} down</div></div>
      <div class="metric-tile"><div class="label">Cap Rate</div><div class="value">${pct(d.capRate)}</div><div class="sub">net operating income</div></div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-title">Monthly cashflow breakdown</div>
        <div class="cf-row"><span>Gross revenue</span><span class="positive" style="font-weight:500">${fmt(d.monthlyRevenue)}</span></div>
        ${expenseRows.map(([label, val]) => `<div class="cf-row"><span class="muted-text">${label}</span><span class="muted-text">(${fmt(val)})</span></div>`).join('')}
        <div class="cf-row"><span>Net cashflow</span><span class="${cashClass}">${d.cashflow >= 0 ? '+' : ''}${fmt(d.cashflow)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Market comps</div>
        ${d.comps.map(c => `
          <div class="comp-row">
            <div><div class="comp-name">${c.name}</div><div class="comp-meta">${c.beds} bed &bull; ${pct(c.occupancy)} occ.</div></div>
            <div><div class="comp-adr">${fmt(c.adr)}<span style="font-size:11px;font-weight:400;color:var(--muted)">/night</span></div><div class="occ-bar"><div class="occ-fill" style="width:${Math.round(c.occupancy*100)}%"></div></div></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="panel insights-panel">
      <div class="panel-title">Deal insights</div>
      ${d.insights.map(i => `<div class="insight-item"><div class="dot ${i.type==='positive'?'dot-green':i.type==='warning'?'dot-red':'dot-amber'}"></div><span>${i.text}</span></div>`).join('')}
    </div>
    <p class="disclaimer">Dealora estimates are AI-generated for research purposes only.<br/>Verify all figures with a licensed realtor and financial advisor before investing.</p>
  `;
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('address').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
</script>
</body>
</html>
